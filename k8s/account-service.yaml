apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: account-service }
  template:
    metadata:
      labels: { app: account-service }
    spec:
      imagePullSecrets:
        - name: acr-pull
      containers:
        - name: account-service
          image: springaiacr2026.azurecr.io/account-service:v1
          ports:
            - containerPort: 8081
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8081 }
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
spec:
  type: ClusterIP
  selector: { app: account-service }
  ports:
    - port: 8081
      targetPort: 8081
