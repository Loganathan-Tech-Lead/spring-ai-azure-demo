apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: loan-service }
  template:
    metadata:
      labels: { app: loan-service }
    spec:
      imagePullSecrets:
        - name: acr-pull
      containers:
        - name: loan-service
          image: springaiacr2026.azurecr.io/loan-service:v2
          ports:
            - containerPort: 8082
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: loan-service
spec:
  type: ClusterIP
  selector:
    app: loan-service
  ports:
    - port: 8082
      targetPort: 8082
