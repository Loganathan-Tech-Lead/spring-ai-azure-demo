trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: spring-ai-secrets # Make sure you create this in Azure DevOps

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: MavenBuild
        displayName: 'Maven Build'
        steps:
          - task: Maven@4
            inputs:
              mavenPomFile: 'pom.xml'
              mavenOptions: '-Xmx3072m'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.17'
              jdkArchitectureOption: 'x64'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              goals: 'clean package'
            env:
              AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_KEY)
              AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)

          - task: CopyFiles@2
            inputs:
              SourceFolder: '$(System.DefaultWorkingDirectory)/target'
              Contents: '*.jar'
              TargetFolder: '$(Build.ArtifactStagingDirectory)'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'

  - stage: Deploy
    displayName: 'Deploy to Azure App Service'
    dependsOn: Build
    jobs:
      - job: Deploy
        displayName: 'Deploy JAR'
        steps:
          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(System.ArtifactsDirectory)'

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'your-service-connection-name' # You will change this in Azure
              appType: 'webAppLinux'
              appName: 'your-app-service-name' # You will change this in Azure
              package: '$(System.ArtifactsDirectory)/drop/*.jar'
              runtimeStack: 'JAVA|17-java17'
              startUpCommand: 'java -jar /home/site/wwwroot/*.jar'
