# Server Port
server.port=8080

# Azure OpenAI Configuration
# Replace these with your actual Azure OpenAI details from the Azure Portal
spring.ai.azure.openai.api-key=YOUR_AZURE_OPENAI_KEY_HERE
spring.ai.azure.openai.endpoint=https://YOUR_RESOURCE_NAME.openai.azure.com/
spring.ai.azure.openai.chat.options.deployment-name=YOUR_DEPLOYMENT_NAME_HERE
# Optional: set temperature and max tokens
# spring.ai.azure.openai.chat.options.temperature=0.7
# spring.ai.azure.openai.chat.options.max-tokens=800
